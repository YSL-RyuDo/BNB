name: Authentication C# checks
on:
  push:
    paths: ['Assets/Script/Login/**', 'Assets/Script/Network/LineMessageBuffer.cs', 'tools/Auth*.cs', 'tools/LineMessageBufferTests.cs', 'tools/test_auth.py', '.github/workflows/authentication.yml']
  pull_request:
    paths: ['Assets/Script/Login/**', 'Assets/Script/Network/LineMessageBuffer.cs', 'tools/Auth*.cs', 'tools/LineMessageBufferTests.cs', 'tools/test_auth.py', '.github/workflows/authentication.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentication:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Assets/Script/Login
            Assets/Script/Network
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Compile and run real authentication handlers with UI doubles
        run: python tools/test_auth.py --out .auth-test-work
      - name: Save authentication test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentication-csharp-results
          path: .auth-test-work/results.txt
